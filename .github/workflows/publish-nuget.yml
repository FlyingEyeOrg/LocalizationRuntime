name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "手动发布的包版本，例如 0.2.0；留空时使用 Directory.Build.props 里的 Version"
        required: false
        type: string

# NuGet 的 Trusted Publishing 走 OIDC，需要 id-token: write 才能换取临时 API Key。
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget-${{ github.ref }}-${{ inputs.package_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: windows-latest
    # 必须与 NuGet.org 上信任策略里填的环境名一致。
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          function Get-Version {
              [xml]$props = Get-Content "Directory.Build.props"
              return [string]$props.Project.PropertyGroup.Version
          }

          $override = "${{ inputs.package_version }}".Trim()
          $version = if ($override) { $override } else { Get-Version }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw "无效的 NuGet 版本：$version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "package version = $version"

      - name: Restore
        run: dotnet restore LocalizationRuntime.sln

      - name: Build
        run: dotnet build LocalizationRuntime.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      # 本机 VSTest testhost 跑不起来，仓库自带一个不依赖它的执行器；CI 上同样用它更稳。
      - name: Test
        run: dotnet run --project tests/LocalizationRuntime.Tests.Runner -c Release --no-build

      # 不用 --no-build：让 pack 自己编译一次，保证 nupkg 里的 dll 与
      # snupkg 里的 pdb 出自同一次编译。用 --no-build 时两者依赖 obj/ 的
      # 残留状态，CI 上曾因此出现 pdb 与 dll 不配套（nuget.org 拒收符号包）。
      - name: Pack LocalizationRuntime
        run: >
          dotnet pack src/LocalizationRuntime/LocalizationRuntime.csproj
          -c Release --no-restore -o artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Pack LocalizationRuntime.Generator
        run: >
          dotnet pack src/LocalizationRuntime.Generator/LocalizationRuntime.Generator.csproj
          -c Release --no-restore -o artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      # 打印实际打进包的 dll/pdb，便于对照 CI 与本地的差异。
      - name: Show packaged symbols
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($pkg in Get-ChildItem artifacts -Filter *.snupkg) {
              Write-Output "== $($pkg.Name) =="
              $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
              $zip.Entries | Where-Object { $_.FullName -like 'lib/*' } |
                  ForEach-Object { Write-Output ("   {0}  {1}" -f $_.FullName, $_.Length) }
              $zip.Dispose()
          }

      # 推之前先自检：符号包与主包必须配套，否则 nuget.org 会在推送阶段才拒收，
      # 报的还只是"pdb 找不到对应 dll"，看不出是哪个 TFM。
      - name: Verify symbol packages
        shell: pwsh
        run: |
          # 不依赖 $LASTEXITCODE：脚本用 throw 结束，这里直接捕获异常文本，
          # 保证失败原因一定能写进 summary。
          try {
              $output = & "$PWD/eng/verify-symbols.ps1" -ArtifactsDirectory artifacts -PackageId LocalizationRuntime 2>&1 | Out-String
              Write-Output $output
              $output | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          catch {
              $detail = ($_ | Out-String)
              Write-Output $detail
              $detail | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              throw
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: LocalizationRuntime-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      # 用 OIDC 换取一次性 API Key，不需要在仓库里存长期密钥。
      - name: Login to NuGet.org with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: UnknowName

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packages = @("LocalizationRuntime", "LocalizationRuntime.Generator")

          foreach ($name in $packages) {
              $nupkg = "artifacts/$name.$version.nupkg"
              if (-not (Test-Path $nupkg)) { throw "找不到打包产物：$nupkg" }

              # --skip-duplicate：同名同版本已发布时视为成功。
              # 重跑工作流、或补推另一个包时都会遇到这种情况，
              # 报错只会让「重试」变成需要人工判断的麻烦事。
              # 它只吞掉「已存在」这一种情况，其他错误仍会以非零退出码暴露。
              $pushOut = dotnet nuget push $nupkg `
                --source "https://api.nuget.org/v3/index.json" `
                --api-key $env:NUGET_API_KEY `
                --skip-duplicate 2>&1 | Out-String
              Write-Output $pushOut
              # 推送结果写进 summary：--skip-duplicate 会把"已存在"当成功，
              # 只在日志里看退出码无法区分"真推了"与"被跳过"。
              $pushOut | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              if ($LASTEXITCODE -ne 0) { throw "$name $version 推送失败（退出码 $LASTEXITCODE）" }

              # 符号包要与主包分开推，且必须在主包之后。
              $snupkg = "artifacts/$name.$version.snupkg"
              if (Test-Path $snupkg) {
                  # 符号包可以重复上传（主包已存在时尤其常见），skip 是合理的。
                  dotnet nuget push $snupkg `
                    --source "https://api.nuget.org/v3/index.json" `
                    --api-key $env:NUGET_API_KEY `
                    --skip-duplicate
                  if ($LASTEXITCODE -ne 0) { throw "$name $version 符号包推送失败（退出码 $LASTEXITCODE）" }
              }
          }